# Alert rules for backupgram's metrics (docs/MONITORING.md). Load them in Prometheus
# with rule_files. The thresholds assume a daily SCHEDULE: adjust them to yours.
groups:
  - name: backupgram
    rules:
      - alert: BackupgramBackupTooOld
        # 26 h: one missed nightly run plus slack. With the textfile collector this also fires
        # when the container is dead, because the file stays on disk. With HTTP scraping a dead
        # backupgram-api makes the series go stale instead: see BackupgramScrapeDown.
        expr: time() - backupgram_backup_last_timestamp_seconds > 26 * 3600
        labels: { severity: warning }
        annotations:
          summary: "The newest {{ $labels.project }} {{ $labels.database }} backup is {{ $value | humanizeDuration }} old"
          description: "The scheduled dump did not happen. Check the backup container's log."

      - alert: BackupgramBackupMissedTwice
        # 50 h: two nightly runs missed.
        expr: time() - backupgram_backup_last_timestamp_seconds > 50 * 3600
        labels: { severity: critical }
        annotations:
          summary: "No {{ $labels.project }} {{ $labels.database }} backup for {{ $value | humanizeDuration }}"

      - alert: BackupgramBackupFailed
        expr: backupgram_backup_success == 0
        labels: { severity: warning }
        annotations:
          summary: "The last {{ $labels.project }} {{ $labels.database }} backup failed"
          description: "Its previous dump is kept. The container's log says why."

      - alert: BackupgramRunFailed
        # Also covers a run that aborted before any database (server unreachable, low disk,
        # discovery found nothing): those runs have no backupgram_backup_success series.
        expr: backupgram_run_success == 0
        labels: { severity: warning }
        annotations:
          summary: "The last {{ $labels.project }} backup run failed"
          description: "The container's log says why."

      - alert: BackupgramBackupShrank
        expr: backupgram_backup_last_size_bytes < 0.5 * max_over_time(backupgram_backup_last_size_bytes[8d])
        labels: { severity: warning }
        annotations:
          summary: "The newest {{ $labels.project }} {{ $labels.database }} dump is less than half the largest of 8 days"
          description: "A dump cut short, or a lot of data gone. Check it before relying on it."

      - alert: BackupgramScrapeDown
        # HTTP scraping only; change job= to your scrape job name.
        expr: up{job="backupgram"} == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Prometheus cannot scrape backupgram's /metrics"
          description: "backupgram-api is down or unreachable, so the other alerts cannot fire."

      - alert: BackupgramLowDisk
        # 1 GiB: raise it for large databases (a dump needs room for itself before the old one goes).
        expr: backupgram_disk_available_bytes < 1073741824
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Less than 1 GiB free for {{ $labels.project }}'s backups"

      - alert: BackupgramOffsiteTooOld
        # 26 h: one missed nightly copy plus slack. Adjust to your schedule.
        expr: time() - backupgram_offsite_last_timestamp_seconds > 26 * 3600
        labels: { severity: warning }
        annotations:
          summary: "The newest off-site {{ $labels.project }} {{ $labels.database }} dump is {{ $value | humanizeDuration }} old"
          description: "The local backup may be fine; the copy to the bucket is not keeping up. An age of decades means the bucket holds no copy at all (unencrypted dumps with S3_ALLOW_UNENCRYPTED=FALSE, or directory dumps). Check the sync's log."

      - alert: BackupgramOffsiteSyncFailed
        expr: backupgram_offsite_sync_success == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "The last off-site sync for {{ $labels.project }} failed"
          description: "The next sync retries what is missing. Check the credentials, the endpoint and the bucket."

      - alert: BackupgramOffsiteNoDatabases
        # 26 h: time for a new deployment's first dump. Adjust to your schedule.
        expr: backupgram_offsite_databases == 0
        for: 26h
        labels: { severity: warning }
        annotations:
          summary: "The off-site sync for {{ $labels.project }} finds no dump to copy"
          description: "last/ in its backup folder holds no dump, so nothing reaches the bucket. Usually the uploader is mounted on the wrong volume (a compose project prefix, a mistyped bind-mount path). Check the sync's log."
