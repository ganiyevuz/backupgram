name: CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/workflows/pushrm.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/**'

# Cancel superseded PR runs (avoids piling up redundant multi-arch builds);
# never cancel an in-progress publish on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs only read the repo; publishing uses a Docker Hub PAT.
permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            tg-upload/go.sum
            s3-sync/go.sum
      - name: Vet and test the MTProto uploader
        working-directory: tg-upload
        run: |
          go vet ./...
          go test ./...

      - name: Vet and test the REST API server
        working-directory: rest-api
        run: |
          go vet ./...
          go test ./... -race

      - name: Vet and test the off-site uploader
        working-directory: s3-sync
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -race

  test-script:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: "database"
          POSTGRES_USER: "user"
          POSTGRES_PASSWORD: "test"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Shared env vars for all test steps
    env:
      POSTGRES_DB: "database"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "test"
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: 5432
      POSTGRES_EXTRA_OPTS: "-Z0"
      BACKUP_DIR: "/tmp/backups"
      POSTGRES_DB_FILE: ""
      POSTGRES_USER_FILE: ""
      POSTGRES_PASSWORD_FILE: ""
      POSTGRES_PASSFILE_STORE: ""
      POSTGRES_CLUSTER: "FALSE"
      POSTGRES_EXCLUDE_TABLES: ""
      BACKUP_SUFFIX: ".sql.gz"
      BACKUP_LATEST_TYPE: "symlink"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      BACKUP_KEEP_MINS: 1440
      BACKUP_ENCRYPTION_KEY: ""
      BACKUP_MIN_DISK_SPACE: 100
      WEBHOOK_URL: ""
      WEBHOOK_EXTRA_ARGS: ""
      TELEGRAM_BOT_TOKEN_FILE: ""
      TELEGRAM_CHAT_ID_FILE: ""
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_THREAD_ID: ""
      TELEGRAM_NOTIFY_ON: "all"
      PROJECT_NAME: "CI Test"

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL Client (pg_dump 16)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg2
          echo "Adding PostgreSQL APT repository..."
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Install scenario test tools (faketime, promtool, tini, go-cron)
        run: |
          sudo apt-get install -y faketime tini
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          promtool --version
          sudo curl -fsSL -o /usr/local/bin/go-cron.gz \
            https://github.com/prodrigestivill/go-cron/releases/download/v0.0.11/go-cron-linux-amd64.gz
          sudo gunzip -f /usr/local/bin/go-cron.gz
          sudo chmod a+x /usr/local/bin/go-cron
          tini --version

      - name: Start the S3 test server (RustFS) and build s3-sync
        run: |
          docker run -d --name s3 -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=testkey -e RUSTFS_SECRET_KEY=testsecret123 rustfs/rustfs:1.0.0
          go build -C s3-sync -o /usr/local/bin/s3-sync .
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:9000/health && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:9000/health

      - name: "Scenario: baseline"
        run: bash tests/scenarios.sh baseline

      - name: "Scenario: Pharmakon fixture"
        run: bash tests/scenarios.sh pharmakon_fixture

      - name: "Scenario: lock held → exit 75"
        run: bash tests/scenarios.sh lock_busy

      - name: "Scenario: failed database → exit 1"
        run: bash tests/scenarios.sh failed_db_exits_1

      - name: "Scenario: period layout + retention over every file"
        run: bash tests/scenarios.sh period_layout_retention

      - name: "Scenario: encrypted custom format, tricky passphrase"
        run: bash tests/scenarios.sh encrypted_custom

      - name: "Scenario: too-small dump keeps the previous one"
        run: bash tests/scenarios.sh min_bytes_keeps_previous

      - name: "Scenario: stale .part removed"
        run: bash tests/scenarios.sh stale_part_removed

      - name: "Scenario: verification rejects garbage"
        run: bash tests/scenarios.sh verify_rejects_garbage

      - name: "Scenario: every format still works"
        run: bash tests/scenarios.sh formats_still_work

      - name: "Scenario: no retention when every database failed"
        run: bash tests/scenarios.sh retention_skipped_when_nothing_succeeded

      - name: "Scenario: Pharmakon discovery (include globs, no-CONNECT skip)"
        run: bash tests/scenarios.sh pharmakon_discovery

      - name: "Scenario: Pharmakon row-level-security guard"
        run: bash tests/scenarios.sh pharmakon_rls_guard

      - name: "Scenario: snapshot layout calendar (faketime)"
        run: bash tests/scenarios.sh snapshot_calendar

      - name: "Scenario: dropped database leaves last/"
        run: bash tests/scenarios.sh dropped_database

      - name: "Scenario: BACKUP_GID permissions"
        run: bash tests/scenarios.sh gid_permissions

      - name: "Scenario: metrics textfile (promtool)"
        run: bash tests/scenarios.sh metrics_textfile

      - name: "Scenario: alert rules and dashboard"
        run: bash tests/scenarios.sh monitoring_assets

      - name: "Scenario: streaming restore of an encrypted custom dump"
        run: bash tests/scenarios.sh restore_encrypted_custom

      - name: "Scenario: Pharmakon single-branch restore (backup-runner)"
        run: bash tests/scenarios.sh pharmakon_branch_restore

      - name: "Scenario: list/status hide dot files, see the lock"
        run: bash tests/scenarios.sh list_status_hide_dot_files

      - name: "Scenario: wrong key on an encrypted SQL dump"
        run: bash tests/scenarios.sh restore_wrong_key_sql

      - name: "Scenario: streamed tar restores whose tail pg_restore never reads"
        run: bash tests/scenarios.sh restore_tar_archive

      - name: "Scenario: no error hook on a successful run"
        run: bash tests/scenarios.sh error_hook_not_fired_on_success

      - name: "Scenario: retention keeps a failing database's copies"
        run: bash tests/scenarios.sh retention_keeps_failing_database

      - name: "Scenario: S3 test server"
        run: bash tests/scenarios.sh s3_smoke

      - name: "Scenario: off-site copies at the end of a backup run"
        run: bash tests/scenarios.sh s3_inline_upload

      - name: "Scenario: an off-site failure is a warning"
        run: bash tests/scenarios.sh s3_upload_failure_is_a_warning

      - name: "Scenario: unencrypted dumps stay local"
        run: bash tests/scenarios.sh s3_refuses_unencrypted

      - name: "Scenario: S3 settings validated, _FILE secrets"
        run: bash tests/scenarios.sh s3_settings_validated

      - name: "Scenario: an S3 setting that breaks after startup"
        run: bash tests/scenarios.sh s3_setting_breaks_at_runtime

      - name: "Scenario: uploader mode (no database, read-only folder, 20 MiB dump)"
        run: bash tests/scenarios.sh s3_uploader_mode

      - name: "Scenario: docker stop reaches the uploader's running sync (tini -g)"
        run: bash tests/scenarios.sh s3_uploader_stop

      - name: "Scenario: off-site retention tiers"
        run: bash tests/scenarios.sh s3_prune_tiers

      - name: "Scenario: S3_PRUNE=FALSE"
        run: bash tests/scenarios.sh s3_no_prune

      - name: "Scenario: restore --from-s3 after losing the server"
        run: bash tests/scenarios.sh s3_restore_from_bucket

      - name: "Scenario: list --s3"
        run: bash tests/scenarios.sh s3_list

      - name: "Scenario: an interrupted restore --from-s3"
        run: bash tests/scenarios.sh s3_restore_interrupted

      - name: Test pg_dump backup
        run: |
          rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
          bash -x scripts/backup.sh
          ls -laR "$BACKUP_DIR"

      - name: Test pg_dump with directory format
        env:
          POSTGRES_EXTRA_OPTS: "-Z0 -Fd"
        run: |
          rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
          bash -x scripts/backup.sh
          ls -laR "$BACKUP_DIR"

      - name: Test pg_dumpall (cluster mode)
        env:
          POSTGRES_CLUSTER: "TRUE"
          POSTGRES_EXTRA_OPTS: ""
        run: |
          rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
          bash -x scripts/backup.sh
          ls -laR "$BACKUP_DIR"

      - name: Test backup with table exclusion
        env:
          POSTGRES_EXCLUDE_TABLES: "pg_stat_statements"
        run: |
          rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
          bash -x scripts/backup.sh
          ls -laR "$BACKUP_DIR"

      - name: Test auto-discover databases
        env:
          POSTGRES_DB_AUTODISCOVER: "TRUE"
          POSTGRES_DB_EXCLUDE: "app2"
        run: |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE app1;" || true
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE app2;" || true
          rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
          bash -x scripts/backup.sh
          ls -laR "$BACKUP_DIR"
          test -n "$(find "$BACKUP_DIR/last" -name 'app1-*.sql.gz' -print -quit)" || (echo "FAIL: app1 not backed up" && exit 1)
          test -n "$(find "$BACKUP_DIR/last" -name 'database-*.sql.gz' -print -quit)" || (echo "FAIL: database (not excluded) not backed up" && exit 1)
          test -z "$(find "$BACKUP_DIR/last" -name 'app2-*' -print -quit)"      || (echo "FAIL: app2 should be excluded" && exit 1)
          test -z "$(find "$BACKUP_DIR/last" -name 'postgres-*' -print -quit)"  || (echo "FAIL: postgres should be excluded" && exit 1)
          echo "✅ auto-discover: app1 present, app2 + postgres excluded"

      - name: Test REST API (build, run, exercise end-to-end)
        env:
          REST_API_ENABLE: "TRUE"
          REST_API_TOKEN: "ci-secret"
          REST_API_PORT: "8099"
          METRICS_ENABLE: "TRUE"
        run: |
          go build -C rest-api -o /usr/local/bin/backupgram-api .
          # The API submits jobs that exec the in-image absolute paths; link the repo scripts there.
          sudo ln -sf "$PWD/scripts/env.sh" /env.sh
          sudo ln -sf "$PWD/scripts/backup.sh" /backup.sh
          sudo ln -sf "$PWD/scripts/restore.sh" /restore.sh
          # Stub scheduler so the supervisor has a child without needing real go-cron.
          printf '#!/usr/bin/env bash\nexec sleep 86400\n' > /usr/local/bin/go-cron-stub
          chmod +x /usr/local/bin/go-cron-stub
          rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
          GOCRON_BIN=/usr/local/bin/go-cron-stub /usr/local/bin/backupgram-api &
          APIPID=$!
          trap 'kill $APIPID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -sf localhost:8099/healthz && break; sleep 0.5; done
          echo
          AUTH=(-H "Authorization: Bearer ci-secret")
          # auth required on a protected route
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8099/status)" = "401"
          # trigger a backup, poll the job to a terminal state
          JOB=$(curl -s "${AUTH[@]}" -X POST localhost:8099/backup | sed -E 's/.*"job_id":"([^"]+)".*/\1/')
          test -n "$JOB" || { echo "no job_id"; exit 1; }
          STATE=""
          for i in $(seq 1 30); do
            STATE=$(curl -s "${AUTH[@]}" "localhost:8099/jobs/$JOB" | sed -E 's/.*"state":"([^"]+)".*/\1/')
            [ "$STATE" = "succeeded" ] && break
            [ "$STATE" = "failed" ] && { echo "backup job failed:"; curl -s "${AUTH[@]}" "localhost:8099/jobs/$JOB"; exit 1; }
            sleep 1
          done
          test "$STATE" = "succeeded" || { echo "job did not finish: $STATE"; exit 1; }
          # /metrics is open (no token) and carries the run's result
          curl -sf localhost:8099/metrics | grep -q '^backupgram_run_success{'
          # the backup appears in the inventory
          curl -s "${AUTH[@]}" localhost:8099/backups | grep -q '"name"'
          # config PATCH writes the override file
          curl -s "${AUTH[@]}" -X PATCH localhost:8099/config -d '{"BACKUP_KEEP_DAYS":"14"}' | grep -q '"BACKUP_KEEP_DAYS"'
          grep -q "export BACKUP_KEEP_DAYS='14'" "$BACKUP_DIR/.api-overrides.env"
          # blocked key rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' "${AUTH[@]}" -X PATCH localhost:8099/config -d '{"POSTGRES_PASSWORD":"x"}')" = "403"
          echo "✅ REST API integration passed"

      - name: Test backup with GPG encryption
        env:
          BACKUP_ENCRYPTION_KEY: "test-encryption-key"
        run: |
          rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
          bash -x scripts/backup.sh
          echo "Verifying encrypted files exist:"
          find "$BACKUP_DIR" -name "*.gpg" | head -20
          GPG_COUNT=$(find "$BACKUP_DIR/last" -name "*.gpg" | wc -l)
          test "$GPG_COUNT" -gt 0 || (echo "No encrypted backup found" && exit 1)

      - name: Test MTProto large-file upload (gated on secrets)
        if: ${{ env.TELEGRAM_API_ID != '' }}
        run: |
          go build -C tg-upload -o /usr/local/bin/tg-upload .
          head -c 60000000 /dev/urandom > /tmp/big.bin
          tg-upload --file /tmp/big.bin --chat "$TELEGRAM_CHAT_ID" --caption "CI MTProto test"

      - name: Test list command
        run: |
          bash scripts/list.sh

      - name: Test restore command (non-interactive)
        run: |
          LATEST=$(find "$BACKUP_DIR/last" -name "database-*.sql.gz" ! -name "*latest*" ! -name "*.gpg" | head -1)
          if [ -n "$LATEST" ]; then
            echo "y" | bash scripts/restore.sh "$LATEST" database
          else
            echo "No backup file found for restore test, skipping."
          fi

      - name: Test backup with Telegram disabled
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_NOTIFY_ON: "none"
        run: |
          rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
          bash -x scripts/backup.sh
          ls -laR "$BACKUP_DIR"

      - name: Test docker-bake.hcl contents
        run: |
          ./generate-docker-bake.sh docker-bake-generated.hcl
          cmp docker-bake.hcl docker-bake-generated.hcl

  test-docker:
    if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
    needs: [ test-script, test-go ]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One job per image target (version × base), built in parallel. Each job gets
    # a fresh runner with full disk, so the multi-arch build no longer exhausts a
    # single runner; a failure is isolated to its target.
    strategy:
      fail-fast: false
      matrix:
        target:
          - debian-latest
          - debian-17
          - debian-16
          - debian-15
          - alpine-latest
          - alpine-17
          - alpine-16
          - alpine-15
    steps:
      - name: Increase available disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Write the shared default Telegram app from repo secrets (build-time only,
      # gitignored). On fork PRs the secrets are empty → an empty file → no default
      # baked (graceful), which is fine for a build test.
      - name: Write shared Telegram app secret (build-time only)
        env:
          TG_DEFAULT_API_ID: ${{ secrets.TG_DEFAULT_API_ID }}
          TG_DEFAULT_API_HASH: ${{ secrets.TG_DEFAULT_API_HASH }}
        run: printf '%s\n%s\n' "$TG_DEFAULT_API_ID" "$TG_DEFAULT_API_HASH" > docker/default-telegram-api

      - name: Build ${{ matrix.target }}
        run: docker buildx bake -f docker-bake.hcl -f docker-bake.secret.hcl --pull ${{ matrix.target }}

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [ test-script, test-go ]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: docker.io
    # Build + push one target per job, in parallel. Each target has its own tags,
    # so per-target jobs push independent multi-arch manifests (no merge step).
    strategy:
      fail-fast: false
      matrix:
        target:
          - debian-latest
          - debian-17
          - debian-16
          - debian-15
          - alpine-latest
          - alpine-17
          - alpine-16
          - alpine-15
    steps:
      - name: Increase available disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure build revision
        run: echo "BUILD_REVISION=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # Bake the shared default Telegram app into the published image from repo
      # secrets (build-time only, gitignored, never in a layer's history/ENV).
      - name: Write shared Telegram app secret (build-time only)
        env:
          TG_DEFAULT_API_ID: ${{ secrets.TG_DEFAULT_API_ID }}
          TG_DEFAULT_API_HASH: ${{ secrets.TG_DEFAULT_API_HASH }}
        run: |
          if [ -z "$TG_DEFAULT_API_ID" ] || [ -z "$TG_DEFAULT_API_HASH" ]; then
            echo "::error::TG_DEFAULT_API_ID / TG_DEFAULT_API_HASH repo secrets are not set" >&2
            exit 1
          fi
          printf '%s\n%s\n' "$TG_DEFAULT_API_ID" "$TG_DEFAULT_API_HASH" > docker/default-telegram-api

      - name: Build and push ${{ matrix.target }}
        env:
          REGISTRY_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/
          BUILD_REVISION: ${{ env.BUILD_REVISION }}
        run: docker buildx bake -f docker-bake.hcl -f docker-bake.secret.hcl --pull --push ${{ matrix.target }}
