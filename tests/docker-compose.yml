# Local harness for tests/scenarios.sh (tests/run-local.sh drives it). CI does not use it:
# the CI job has its own PostgreSQL 16 service and runs the same scenarios.
name: backupgram-tests

services:
  db:
    image: postgres:${PG_MAJOR:-18}-alpine
    command: ["postgres", "-c", "timezone=Asia/Dubai"]
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: user
      POSTGRES_PASSWORD: test
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d database"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The S3 test server. RustFS runs as a non-root user, so /data stays the image's own volume
  # (a tmpfs there is root-owned and kills it); `down -v` removes it. Ready on GET /health -> 200
  # (it answers 503 for a moment first): s3_env in tests/lib.sh retries until then.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: testkey
      RUSTFS_SECRET_KEY: testsecret123

  runner:
    build:
      context: ..
      dockerfile: tests/runner.Dockerfile
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }
    working_dir: /work
    volumes:
      - ..:/work
    # exec: scenarios put stub executables (a fake pg_dump) under /tmp; Docker mounts tmpfs noexec by default.
    tmpfs: ["/tmp:exec"]
    # The CI job's environment (.github/workflows/ci.yml, test-script), pointed at the db service.
    environment:
      TZ: Asia/Dubai
      POSTGRES_DB: database
      POSTGRES_USER: user
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_EXTRA_OPTS: "-Z0"
      BACKUP_DIR: /tmp/backups
      POSTGRES_CLUSTER: "FALSE"
      BACKUP_SUFFIX: ".sql.gz"
      BACKUP_LATEST_TYPE: "symlink"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      BACKUP_KEEP_MINS: "1440"
      BACKUP_MIN_DISK_SPACE: "100"
      TELEGRAM_NOTIFY_ON: "none"
      PROJECT_NAME: "CI Test"
      TEST_S3_ENDPOINT: http://s3:9000
