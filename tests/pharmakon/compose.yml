# Acceptance: the real image with Pharmakon's backup configuration (spec §12) against the
# Pharmakon-shaped fixture. tests/pharmakon/acceptance.sh drives it.
name: backupgram-pharmakon

services:
  db:
    image: postgres:18-alpine
    command: ["postgres", "-c", "timezone=Asia/Dubai"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: admin
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [dbnet]

  runner:
    build:
      context: ../..
      dockerfile: tests/runner.Dockerfile
    depends_on:
      db: { condition: service_healthy }
    working_dir: /work
    environment:
      TZ: Asia/Dubai
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SU_USER: platform_admin
      SU_PASSWORD: admin
    volumes:
      - ../..:/work
      - backups:/backups
      - textfile:/textfile
    networks: [dbnet, s3net]

  backup:
    image: ${BACKUPGRAM_IMAGE:-backupgram-local:18-alpine}
    pull_policy: never
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: svc_backup
      POSTGRES_PASSWORD: svc_pw
      POSTGRES_DB_AUTODISCOVER: "TRUE"
      POSTGRES_DB_INCLUDE: "control,pharmacy_*"
      POSTGRES_EXTRA_OPTS: "-Fc --enable-row-security --lock-wait-timeout=60s --exclude-schema=br*_before_*"
      BACKUP_SUFFIX: ".dump"
      BACKUP_LATEST_TYPE: "none"
      BACKUP_LAYOUT: "snapshot"
      BACKUP_RLS_GUARD: "TRUE"
      BACKUP_MIN_BYTES: "1024"
      BACKUP_GID: "1000"
      BACKUP_ENCRYPTION_KEY: "pharmakon acceptance key"
      SCHEDULE: "0 4 * * *"
      TZ: Asia/Dubai
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "3"
      TELEGRAM_USE_DEFAULT_API: "FALSE"
      METRICS_TEXTFILE_DIR: /textfile
      PROJECT_NAME: platform-test
    tmpfs: ["/tmp"]
    volumes:
      - backups:/backups
      - textfile:/textfile
      - ./10-manual-dir:/hooks/10-manual-dir:ro
    networks: [dbnet]

  # Off-site copies: an S3 server and the uploader beside the backup. The uploader has no
  # database network, no key and a read-only /backups; it reaches only the S3 server.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: testkey
      RUSTFS_SECRET_KEY: testsecret123
    networks: [s3net]

  uploader:
    image: ${BACKUPGRAM_IMAGE:-backupgram-local:18-alpine}
    pull_policy: never
    depends_on:
      s3: { condition: service_started }
    environment:
      BACKUPGRAM_MODE: s3-sync
      S3_BUCKET: platform-offsite
      S3_ENDPOINT: http://s3:9000
      S3_FORCE_PATH_STYLE: "TRUE"
      S3_PREFIX: platform-test
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      S3_SCHEDULE: "0 0 1 1 *"          # the acceptance run triggers syncs by hand
      TZ: Asia/Dubai
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "3"
      PROJECT_NAME: platform-test
    secrets: [s3_access_key_id, s3_secret_access_key]
    tmpfs: ["/tmp"]
    volumes:
      - backups:/backups:ro
    networks: [s3net]

networks:
  dbnet: {}
  s3net: {}

secrets:
  s3_access_key_id:
    file: ./s3_access_key_id.test
  s3_secret_access_key:
    file: ./s3_secret_access_key.test

volumes:
  backups:
  textfile:
